databases:
  - name: fleetco-db
    plan: free
    databaseName: fleetco
    user: fleetco

services:
  - type: web
    name: fleetco-management
    runtime: node
    plan: free
    buildCommand: npm run build:render
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ORIGIN
        value: https://fleetcomanagement.org
      - key: PUBLIC_APP_URL
        value: https://fleetcomanagement.org
      - key: VITE_SITE_URL
        value: https://fleetcomanagement.org
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: fleetco-db
          property: connectionString
      - key: SEED_DEMO_DATA
        value: "false"
      - key: DATA_PATH
        value: /opt/render/project/src/server/data
      # Uploads on the same persistent disk — survives redeploy (increase disk sizeGB for video)
      - key: UPLOADS_PATH
        value: /opt/render/project/src/server/data/uploads
      # Optional: Cloudflare R2 mirror for scalable video (recommended when disk fills)
      # - key: R2_BUCKET
      #   sync: false
      # - key: R2_ENDPOINT
      #   sync: false
      # - key: R2_ACCESS_KEY_ID
      #   sync: false
      # - key: R2_SECRET_ACCESS_KEY
      #   sync: false
      # AI — marketing guide + autopilot (console.groq.com)
      - key: GROQ_API_KEY
        sync: false
      # Email — Resend (resend.com, verify fleetcomanagement.org)
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: FleetCo Management <support@fleetcomanagement.org>
      - key: INQUIRY_TO
        value: support@fleetcomanagement.org
      - key: SLT_INBOX
        value: support@fleetcomanagement.org
      - key: SLT_PAYMENT_ALERT_EMAILS
        sync: false
      - key: SLT_MARKETING_REPORT_EMAILS
        sync: false
      # Stripe — subscriptions, broker cards, load fees (dashboard.stripe.com)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CONNECT_ENABLED
        value: "true"
      # Schedulers (set to "true" only to disable)
      # - key: MARKETING_AUTOPILOT_DISABLED
      # - key: CARRIER_PAYMENT_SCHEDULER_DISABLED
      - key: OWNER_BOOTSTRAP_PASSWORD
        sync: false
      - key: OWNER_FORCE_PASSWORD_RESET
        sync: false
      # Live video — LiveKit Cloud (cloud.livekit.io) for WebRTC streaming + 15-day recordings
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVE_STREAM_RETENTION_DAYS
        value: "15"
    disk:
      name: fleetco-data
      mountPath: /opt/render/project/src/server/data
      # Bump to 10+ GB when storing live WebM recordings on disk; or use R2 env vars above
      sizeGB: 10
    healthCheckPath: /api/public-settings

# Go-live checklist (run after deploy):
#   node scripts/go-live-check.mjs
# Or hit: GET https://fleetcomanagement.org/api/system/live-status
#
# Stripe webhook: https://fleetcomanagement.org/api/billing/webhook
# Events: checkout.session.completed, payment_intent.succeeded,
#         payment_intent.payment_failed, invoice.paid
